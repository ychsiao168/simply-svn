<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#2C5F9B"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="16" fill="url(#bg)"/>
  <!-- Branch lines (small, overlapping with text) -->
  <g stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4">
    <line x1="50" y1="30" x2="50" y2="70"/>
    <line x1="50" y1="45" x2="72" y2="32"/>
    <circle cx="50" cy="70" r="3.5" fill="#ffffff"/>
    <circle cx="50" cy="30" r="3.5" fill="#ffffff"/>
    <circle cx="72" cy="32" r="3.5" fill="#ffffff"/>
  </g>
  <!-- SVN text (large, centered) -->
  <text x="64" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="52" fill="#ffffff">SVN</text>
</svg>
